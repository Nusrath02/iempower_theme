[project]
name = "iempower_theme"
authors = [
    { name = "ITChamps Software Private Limited" }
]
description = "Shared visual theme (design tokens, CSS, and generic UI widgets) for the iEmpPower ESS portal."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0-dev,<17.0.0"
